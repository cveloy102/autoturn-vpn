plugins { id 'com.android.application' }

android {
    namespace 'app.autoturn.vpn'
    compileSdk 37

    defaultConfig {
        applicationId 'app.autoturn.vpn'
        minSdk 31
        targetSdk 36
        versionCode 36
        versionName '2.1.0'
        testApplicationId 'app.autoturn.vpn.instrumentation'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    // Use the original local debug key so updates keep the existing encrypted profiles.
    if (file('../.android/debug.keystore').exists()) {
        signingConfigs.debug.storeFile = file('../.android/debug.keystore')
    }

    buildFeatures { buildConfig true; aidl true }

    buildTypes {
        // Side-by-side test build: its own application id (and therefore its own encrypted
        // profiles), so the working AutoTurn installation is never touched or overwritten.
        staging {
            initWith debug
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation project(':amneziawg-tunnel')
    implementation files('libs/libXray.aar')
    androidTestCompileOnly files(androidComponents.sdkComponents.sdkDirectory.map { sdk ->
        sdk.dir('platforms/android-37.0/optional').asFileTree.matching {
            include 'android.test.base.jar', 'android.test.runner.jar'
        }
    })
}
