name: Android build and lint

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Tunnel and protection tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: XTLS/libXray
          ref: 50b95979f5db551bd273165cf469e5daaf791341 # v26.9.9, matches libXray.aar
          path: .deps/libxray
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            third_party/qwdtt-client/src/go.sum
            .deps/libxray/go.sum
      - name: Protected mode, SOCKS, DNS and Xray chain
        shell: pwsh
        run: |
          ./tools/test-protected.ps1 -Jdk $env:JAVA_HOME
          ./tools/test-qwdtt.ps1 -Jdk $env:JAVA_HOME -Go (Get-Command go).Source

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Unit tests, build APKs and run lint
        run: sh ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleStaging :app:lintDebug :app:lintStaging --no-daemon
      - name: Upload APKs for the emulator checks
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload side-by-side test APK
        uses: actions/upload-artifact@v4
        with:
          name: autoturn-test-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: |
            app/build/reports/lint-results-*
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  device:
    name: Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: autoturn-test-apk
          path: staging
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -g apks/debug/app-debug.apk
            adb install staging/app-staging.apk
            adb install -t apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class app.autoturn.vpn.ModelValidationTest,app.autoturn.vpn.EndpointResolverTest,app.autoturn.vpn.TileToggleTest,app.autoturn.vpn.LiveIslandNotificationTest app.autoturn.vpn.instrumentation/android.test.InstrumentationTestRunner | tee emulator-tests.txt
            grep -Eq '^OK \([1-9][0-9]* tests?\)' emulator-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: emulator-tests.txt
          if-no-files-found: ignore
